<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M3 Cards demo</title>
<meta name="description" content="Try M3 Cards for Home Assistant in your browser — a pretend home with simulated values, nothing connected.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Home Assistant's theme variables, in a green Material You palette. */
  :root {
    color-scheme: dark;
    --primary-text-color: #e0e4dc;
    --secondary-text-color: #b4bcae;
    --disabled-text-color: #7b8476;
    --card-background-color: #1a211b;
    --ha-card-background: #1a211b;
    --primary-background-color: #101510;
    --secondary-background-color: #151b16;
    --primary-color: #9dd67d;
    --accent-color: #aad291;
    --state-icon-color: #b4bcae;
    --divider-color: rgba(255, 255, 255, 0.1);
    --error-color: #ffb4ab;
    --warning-color: #f0c46e;
    --success-color: #9dd67d;
    --info-color: #8db4e6;
    --ha-card-border-radius: 28px;
    --ha-card-border-width: 0px;
    --mdc-theme-primary: var(--primary-color);
    --page-bg:
      radial-gradient(900px 600px at 15% 10%, rgba(80, 140, 70, 0.35), transparent 60%),
      radial-gradient(800px 700px at 90% 30%, rgba(40, 110, 90, 0.35), transparent 60%),
      radial-gradient(700px 500px at 50% 100%, rgba(120, 150, 60, 0.25), transparent 60%),
      #0c120d;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --primary-text-color: #191d17;
    --secondary-text-color: #43493f;
    --disabled-text-color: #8a9185;
    --card-background-color: #f8faf2;
    --ha-card-background: #f8faf2;
    --primary-background-color: #eef2e8;
    --secondary-background-color: #e6ebdf;
    --primary-color: #3b6939;
    --accent-color: #3b6939;
    --state-icon-color: #43493f;
    --divider-color: rgba(0, 0, 0, 0.1);
    --error-color: #ba1a1a;
    --warning-color: #8a5a00;
    --success-color: #3b6939;
    --page-bg:
      radial-gradient(900px 600px at 15% 10%, rgba(160, 210, 140, 0.55), transparent 60%),
      radial-gradient(800px 700px at 90% 30%, rgba(150, 210, 190, 0.5), transparent 60%),
      radial-gradient(700px 500px at 50% 100%, rgba(220, 230, 160, 0.45), transparent 60%),
      #eef2e8;
  }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--page-bg);
    background-attachment: fixed;
    color: var(--primary-text-color);
    font-family: "Roboto Flex", Roboto, system-ui, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    backdrop-filter: blur(16px);
    background: color-mix(in srgb, var(--primary-background-color) 55%, transparent);
  }
  header .brand { font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }
  header .brand b { color: var(--primary-color); }
  header .note { color: var(--secondary-text-color); font-size: 14px; flex: 1; }
  header button, header a {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-width: 44px; height: 44px; padding: 0 14px; border: 0; border-radius: 22px;
    background: color-mix(in srgb, var(--primary-text-color) 10%, transparent);
    color: var(--primary-text-color); font: 600 15px "Roboto Flex", Roboto, sans-serif; text-decoration: none; cursor: pointer;
  }
  /* A switch that is on: tinted, with a check in front of its name. */
  header button.toggle.on { background: color-mix(in srgb, var(--primary-color) 22%, transparent); color: var(--primary-color); }
  header button.toggle .lbl::before { content: ""; }
  header button.toggle.on .lbl::before { content: "✓ "; }
  header .sep { width: 1px; height: 24px; background: var(--divider-color); margin: 0 2px; }
  header .lbl { white-space: nowrap; font-size: 14px; }
  header button:hover, header a:hover { background: color-mix(in srgb, var(--primary-text-color) 16%, transparent); }
  #view-root { padding: 8px 16px 140px; }
  .sections {
    display: flex;
    gap: 20px;
    max-width: 1500px;
    margin: 0 auto;
    align-items: flex-start;
  }
  .column { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  .section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .section h2 { margin: 8px 4px 0; font-size: 17px; font-weight: 600; color: var(--primary-text-color); }
  .card-wrap { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .card-title {
    display: flex; align-items: center; gap: 8px; margin: 2px 4px 0 8px; min-width: 0;
    color: var(--secondary-text-color);
    font: 600 12px "Roboto Flex", Roboto, sans-serif; letter-spacing: 0.01em;
  }
  .card-title > a { display: flex; align-items: baseline; gap: 8px; min-width: 0; color: inherit; text-decoration: none; }
  .card-title > a:hover { color: var(--primary-color); }
  .copy-yaml {
    margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 4px;
    height: 22px; padding: 0 8px; border: 0; border-radius: 11px; cursor: pointer;
    background: color-mix(in srgb, var(--primary-text-color) 9%, transparent); color: var(--secondary-text-color);
    font: 600 11px "Roboto Flex", Roboto, sans-serif;
    --mdc-icon-size: 13px;
  }
  .copy-yaml:hover { background: color-mix(in srgb, var(--primary-text-color) 15%, transparent); color: var(--primary-text-color); }
  .copy-yaml.done { background: color-mix(in srgb, var(--primary-color) 22%, transparent); color: var(--primary-color); }
  .card-title span { white-space: nowrap; }
  .card-title code { font: 500 11px ui-monospace, "SF Mono", Menlo, monospace; opacity: 0.6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-title em { font: 600 11px ui-monospace, "SF Mono", Menlo, monospace; font-style: normal; padding: 1px 7px; border-radius: 8px; white-space: nowrap;
    color: var(--primary-color); background: color-mix(in srgb, var(--primary-color) 16%, transparent); }
  .card-title > a:hover code { opacity: 0.9; }
  body.no-titles .card-title { display: none; }
  .card-error { padding: 16px; border-radius: 16px; background: #5a1f1f; color: #ffd9d4; font: 13px monospace; }
  @media (max-width: 1500px) {
    header .note { display: none; }
    header .brand { flex: 1; }
  }
  /* Too narrow for the names: the icons alone, the names as tooltips. */
  @media (max-width: 1080px) {
    header .lbl { display: none; }
    header .sep { display: none; }
  }
  @media (max-width: 600px) {
    header { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
    header button, header a { min-width: 40px; height: 40px; padding: 0 10px; }
    #view-root { padding: 8px 12px 140px; }
  }
  /* Inside the phone frame: the page alone, no header of its own. */
  body.embed header { display: none; }
  body.embed #view-root { padding: 12px 12px 130px; }
  body.embed .m3n-toasts { top: 12px; }
  body.embed { background-attachment: scroll; }
  /* The phone frame around it. */
  #phone-host { display: none; }
  body.phone-mode #view-root { display: none; }
  body.phone-mode #phone-host { display: flex; justify-content: center; padding: 20px 16px 40px; }
  .phone-frame {
    width: 393px; height: 852px; max-height: calc(100vh - 110px); aspect-ratio: 393 / 852;
    padding: 12px; border-radius: 58px; box-sizing: content-box;
    background: #0b0b0c; box-shadow: 0 0 0 2px #2a2a2e, 0 30px 80px rgba(0, 0, 0, 0.55);
  }
  .phone-frame iframe { width: 100%; height: 100%; border: 0; border-radius: 46px; background: #0c120d; display: block; }
</style>
</head>
<body>
<header>
  <span class="brand"><b>M3</b> Cards</span>
  <span class="note">A pretend home with simulated values — tap around, nothing is connected.</span>
  <span class="sep"></span>
  <button id="phone" class="toggle"><ha-icon icon="mdi:cellphone"></ha-icon><span class="lbl"></span></button>
  <button id="titles" class="toggle"><ha-icon icon="mdi:label-outline"></ha-icon><span class="lbl"></span></button>
  <button id="glass" class="toggle"><ha-icon icon="mdi:blur"></ha-icon><span class="lbl"></span></button>
  <button id="theme"><ha-icon icon="mdi:weather-sunny"></ha-icon><span class="lbl"></span></button>
  <button id="lang"><ha-icon icon="mdi:translate"></ha-icon><span class="lbl"></span></button>
  <a href="https://github.com/j0sp0r/m3-cards" title="GitHub"><ha-icon icon="mdi:github"></ha-icon><span class="lbl">GitHub</span></a>
</header>
<main id="view-root"></main>
<div id="phone-host"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
